services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN before starting Compose}
      VALKEY_URL: redis://valkey:6379
      GITPULSE_CACHE_TTL: ${GITPULSE_CACHE_TTL:-24H}
  valkey:
    image: docker.io/valkey/valkey:8.0.2-alpine
