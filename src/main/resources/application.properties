# GitHub REST Client Configuration
quarkus.rest-client.github-api.url=https://api.github.com
quarkus.rest-client.github-api.connect-timeout=3000
quarkus.rest-client.github-api.read-timeout=10000
github.token=${GITHUB_TOKEN}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000

# Valkey uses the Redis protocol. Production must provide its own endpoint.
%prod.quarkus.redis.hosts=${VALKEY_URL}
quarkus.redis.devservices.image-name=docker.io/valkey/valkey:8.0.2-alpine
quarkus.redis.devservices.shared=false
%test.quarkus.redis.devservices.enabled=false
quarkus.redis.timeout=1s
quarkus.redis.health.enabled=false
gitpulse.cache.ttl=${GITPULSE_CACHE_TTL:15M}
%dev.gitpulse.cache.ttl=${GITPULSE_CACHE_TTL:24H}